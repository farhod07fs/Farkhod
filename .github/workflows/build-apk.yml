name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk tests-5-klass.apk
          cp vilenkin/build/outputs/apk/release/vilenkin-release.apk matematika-5-vilenkin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tests-5-klass-apk
          path: |
            tests-5-klass.apk
            matematika-5-vilenkin.apk
      # Постоянная ссылка на свежий APK: релиз «apk-latest» обновляется при каждой сборке.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tests-5-klass.apk matematika-5-vilenkin.apk \
            --title "Тесты 5 класс — APK" \
            --notes "Сборка из ${GITHUB_SHA::7}. tests-5-klass.apk — тесты 5 класс (9 предметов), matematika-5-vilenkin.apk — математика по Виленкину (28 тестов)." \
            --target "$GITHUB_SHA" --prerelease
