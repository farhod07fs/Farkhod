name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tests-5-klass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tests-5-klass-apk
          path: tests-5-klass.apk
      # Постоянная ссылка на свежий APK: релиз «apk-latest» обновляется при каждой сборке.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tests-5-klass.apk \
            --title "Тесты 5 класс — APK" \
            --notes "Сборка из ${GITHUB_SHA::7}. Скачайте tests-5-klass.apk и установите на телефон." \
            --target "$GITHUB_SHA" --prerelease
